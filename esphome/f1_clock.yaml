<<: !include build_info.yaml

esphome:
  name: f1_clock

  on_boot:
    priority: -10
    then:
      - light.turn_on:
          id: f1_strip
          effect: f1_live

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: http_request
    id: http_ota
        
wifi:
  reboot_timeout: 0s

  ap:
    ssid: "F1Clock"
    password: "12345678"

  on_connect:
    then:
      - lambda: |-
          id(wifi_ok) = true;
          id(demo_active) = false;   // Stop demo mode

  on_disconnect:
    then:
      - lambda: |-
          id(wifi_ok) = false;
          id(demo_active) = true;    // Start demo mode

captive_portal:

esp32_improv:
  authorizer: none

web_server:
  port: 80
  version: 3

http_request:

mqtt:
  broker: gelden.ddns.net
  port: 2105
  username: f1reader
  password: f1reader
  discovery: false
  reboot_timeout: 0s
  keepalive: 15s
  log_topic: none

  on_connect:
    then:
      - lambda: |-
          id(mqtt_ok) = true;
      - script.execute: try_startup

  on_message:
    - topic: f1/f1_track_status/state
      qos: 0
      then:
        - lambda: |-
            id(track_state) = x.c_str();
            std::transform(id(track_state).begin(), id(track_state).end(), id(track_state).begin(), ::toupper);

            if (id(track_state) != "UNAVAILABLE") {
                id(track_state_initialized) = true;
            }

            if (!id(track_state_initialized) && id(session_state) == "LIVE") {
                id(f1_strip).turn_on().set_effect("CLEAR").perform();
                return;
            }

            if (!id(ota_in_progress) && !id(startup_active)) {
                id(f1_strip).turn_on().set_effect("f1_live").perform();
            }
            
    - topic: f1/f1_race_week/state
      qos: 0
      then:
        - lambda: |-
            std::string s = x.c_str();
            std::transform(s.begin(), s.end(), s.begin(), ::toupper);
            id(raceweek_state) = (s == "ON");

            if (!id(ota_in_progress) && !id(startup_active)) {
                id(f1_strip).turn_on().set_effect("f1_live").perform();
            }

    - topic: f1/firmware/latest-clock
      qos: 0
      then:
        - lambda: |-
            id(latest_firmware_sensor).publish_state(x.c_str());

    - topic: f1/firmware/url-clock
      qos: 0
      then:
        - lambda: |-
            id(firmware_url) = x.c_str();
            ESP_LOGI("ota", "Firmware URL updated to: %s", id(firmware_url).c_str());
    
    - topic: f1/f1_session_status/state
      qos: 0
      then:
        - lambda: |-
            id(session_state) = x.c_str();
            std::transform(id(session_state).begin(), id(session_state).end(), id(session_state).begin(), ::toupper);

            if (id(track_state) == "UNAVAILABLE" && id(session_state) == "LIVE") {
                if (!id(ota_in_progress) && !id(startup_active)) {
                    id(f1_strip).turn_on().set_effect("CLEAR").perform();
                }
            }


globals:
  - id: track_state
    type: std::string
    initial_value: '"UNAVAILABLE"'
    restore_value: false

  - id: raceweek_state
    type: bool
    initial_value: "false"
    restore_value: false

  - id: startup_done
    type: bool
    initial_value: "false"
    restore_value: false

  - id: wifi_ok
    type: bool
    initial_value: "false"

  - id: mqtt_ok
    type: bool
    initial_value: "false"

  - id: firmware_version_global
    type: std::string
    initial_value: "\"${firmware_version}\""
  
  - id: firmware_url
    type: std::string
    initial_value: ""
    restore_value: False

  - id: ota_in_progress
    type: bool
    restore_value: no
    initial_value: "false"

  - id: startup_active
    type: bool
    restore_value: no
    initial_value: "true"

  - id: session_state
    type: std::string
    initial_value: '"UNAVAILABLE"'
    restore_value: false

  - id: track_state_initialized
    type: bool
    initial_value: "false"
    restore_value: false

  - id: demo_active
    type: bool
    initial_value: "true"
    restore_value: false


switch:
  - platform: template
    name: "Raceweek LEDs"
    id: raceweek_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON


text_sensor:
  - platform: template
    name: "Installed Firmware Version"
    id: firmware_version_sensor
    icon: "mdi:chip"
    lambda: |-
      return id(firmware_version_global);
    update_interval: 1h

  - platform: template
    name: "Latest Firmware Version"
    id: latest_firmware_sensor
    icon: "mdi:update"
    update_interval: 5s


binary_sensor:
  - platform: template
    name: "Firmware Update Available"
    id: update_available
    device_class: update
    lambda: |-
      if (id(latest_firmware_sensor).state.empty()) return false;
      return id(latest_firmware_sensor).state != id(firmware_version_global);
      

script:
  - id: try_startup
    mode: queued
    then:
      - lambda: |-
          if (id(startup_done)) return;
          if (!id(wifi_ok) || !id(mqtt_ok)) return;
      - light.turn_on:
          id: f1_strip
          effect: startup_lightsout

  - id: do_ota
    then:
      - lambda: |-
          id(ota_in_progress) = true;

      - light.turn_on:
          id: f1_strip
          effect: "OTA_BLUE_GLOW"
      
      - delay: 4s
      - logger.log: "OTA gestart via HTTP..."

      - ota.http_request.flash:
          url: "https://raw.githubusercontent.com/egelden/f1-clock/main/build/f1-clock-OTA.bin"
          md5_url: "https://raw.githubusercontent.com/egelden/f1-clock/main/build/f1-clock-OTA.bin.md5"


interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(ota_in_progress)) return;
          if (!id(wifi_ok)) return;
          if (!id(mqtt_ok)) return;
          if (id(latest_firmware_sensor).state.empty()) return;
          if (id(latest_firmware_sensor).state == id(firmware_version_global)) return;

          ESP_LOGI("ota", "Nieuwe firmware gedetecteerd — OTA wordt gestart!");
          id(do_ota).execute();

  - interval: 1s
    then:
      - lambda: |-
          if (!id(demo_active)) return;

          static int step = 0;
          static int timer = 0;

          timer++;

          if (timer % 6 == 0) {
            id(raceweek_state) = !id(raceweek_state);
          }

          if (step == 0 && timer >= 10) { step = 1; timer = 0; }
          if (step == 1 && timer >= 2)  { step = 2; timer = 0; }
          if (step == 2 && timer >= 10) { step = 3; timer = 0; }
          if (step == 3 && timer >= 2)  { step = 4; timer = 0; }
          if (step == 4 && timer >= 10) { step = 5; timer = 0; }
          if (step == 5 && timer >= 2)  { step = 6; timer = 0; }
          if (step == 6 && timer >= 10) { step = 7; timer = 0; }
          if (step == 7 && timer >= 2)  { step = 8; timer = 0; }
          if (step == 8 && timer >= 10) { step = 9; timer = 0; }
          if (step == 9 && timer >= 2)  { step = 0; timer = 0; }

          if (step == 0)  id(f1_strip).turn_on().set_effect("CLEAR").perform();
          if (step == 1)  id(f1_strip).turn_on().set_effect("BLACK").perform();
          if (step == 2)  id(f1_strip).turn_on().set_effect("YELLOW").perform();
          if (step == 3)  id(f1_strip).turn_on().set_effect("BLACK").perform();
          if (step == 4)  id(f1_strip).turn_on().set_effect("RED").perform();
          if (step == 5)  id(f1_strip).turn_on().set_effect("BLACK").perform();
          if (step == 6)  id(f1_strip).turn_on().set_effect("VSC").perform();
          if (step == 7)  id(f1_strip).turn_on().set_effect("BLACK").perform();
          if (step == 8)  id(f1_strip).turn_on().set_effect("SC").perform();
          if (step == 9)  id(f1_strip).turn_on().set_effect("BLACK").perform();


light:
  - platform: esp32_rmt_led_strip
    id: f1_strip
    name: "F1 LED Strip"
    internal: false
    pin: 13
    num_leds: 60
    chipset: ws2812
    rgb_order: grb

    effects:

      - addressable_lambda:
          name: BLACK
          update_interval: 200ms
          lambda: |-
            it.all() = Color(0,0,0);

      - addressable_lambda:
          name: startup_lightsout
          update_interval: 50ms
          lambda: |-
            static int step = 0;
            static unsigned long last_change = 0;
            static int wait_time = 0;

            if (id(startup_done)) {
              id(f1_strip).turn_on().set_effect("f1_live").perform();
              return;
            }

            unsigned long now = millis();

            if (wait_time == 0) {
              wait_time = 1000 + (rand() % 301);
              last_change = now;
            }

            it.all().fade_to_black(255);

            const int block_positions[5] = {0, 3, 6, 9, 12};

            if (step < 5) {
              for (int i = 0; i <= step; i++) {
                int idx = block_positions[i];
                it[idx] = Color(255, 0, 0);
              }
            }

            if (now - last_change >= (unsigned long)wait_time) {
              step++;
              last_change = now;
              wait_time = 1000 + (rand() % 301);
            }

            if (step == 5) {
              it.all().fade_to_black(255);
            }

            if (step > 5) {
              step = 0;
              wait_time = 0;
              id(startup_done) = true;
              id(startup_active) = false;

              auto on = id(f1_strip).turn_on();
              on.set_effect("f1_live");
              on.perform();
            }

      - addressable_lambda:
          name: f1_live
          update_interval: 180ms
          lambda: |-
            it.all().fade_to_black(255);

            if (id(track_state) == "CLEAR") {
              it.range(13, 60) = Color(0,255,0);
            }
            else if (id(track_state) == "YELLOW") {
              static bool on = false;
              on = !on;
              it.range(13, 60) = on ? Color(255,200,0) : Color(0,0,0);
            }
            else if (id(track_state) == "RED") {
              static bool on = false;
              on = !on;
              it.range(13, 60) = on ? Color(255,0,0) : Color(0,0,0);
            }
            else if (id(track_state) == "VSC") {
              static bool toggle = false;
              toggle = !toggle;
              if (toggle)
                it.range(20, 29) = Color(255,255,0);
              else
                it.range(44, 53) = Color(255,255,0);
            }
            else if (id(track_state) == "SC") {
              static bool toggle = false;
              toggle = !toggle;
              if (toggle)
                it.range(20, 29) = Color(255,180,0);
              else
                it.range(44, 53) = Color(255,180,0);
            }

            if (id(raceweek_state)) {
              it.range(0, 13) = Color(255,0,0);
            }

      - addressable_lambda:
          name: CLEAR
          update_interval: 200ms
          lambda: |-
            it.range(13, 60) = Color(0,255,0);

      - addressable_lambda:
          name: YELLOW
          update_interval: 180ms
          lambda: |-
            static bool on = false;
            on = !on;
            it.range(13, 60) = on ? Color(255,200,0) : Color(0,0,0);

      - addressable_lambda:
          name: RED
          update_interval: 180ms
          lambda: |-
            static bool on = false;
            on = !on;
            it.range(13, 60) = on ? Color(255,0,0) : Color(0,0,0);

      - addressable_lambda:
          name: VSC
          update_interval: 180ms
          lambda: |-
            static bool toggle = false;
            toggle = !toggle;

            if (toggle) {
              it.range(13, 19) = Color(0,0,0);
              it.range(20, 29) = Color(255,255,0);
              it.range(30, 60) = Color(0,0,0);
            } else {
              it.range(13, 43) = Color(0,0,0);
              it.range(44, 53) = Color(255,255,0);
              it.range(54, 60) = Color(0,0,0);
            }

      - addressable_lambda:
          name: SC
          update_interval: 180ms
          lambda: |-
            static bool toggle = false;
            toggle = !toggle;

            if (toggle) {
              it.range(13, 19) = Color(0,0,0);
              it.range(20, 29) = Color(255,180,0);
              it.range(30, 60) = Color(0,0,0);
            } else {
              it.range(13, 43) = Color(0,0,0);
              it.range(44, 53) = Color(255,180,0);
              it.range(54, 60) = Color(0,0,0);
            }

      - addressable_lambda:
          name: RACEWEEK
          update_interval: 200ms
          lambda: |-
            it.range(0, 12) = Color(255,0,0);

      - addressable_lambda:
          name: OTA_BLUE_GLOW
          update_interval: 30ms
          lambda: |-
            it.all().fade_to_black(40);

            const float speed = 0.004;
            float t = millis() * speed;
            float breath = (sin(t) + 1.0f) / 2.0f;
            int b = int(200 * breath);

            it.range(13, 60) = Color(0, 0, b);
